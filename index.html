<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陈鸿权同学升学宴邀请</title>
    <style>
        /* --- 基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* 全屏容器 */
        #app { position: relative; width: 100%; height: 100%; }

        /* --- 加载遮罩层 (Loading Screen) --- */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff;
            transition: opacity 1s ease;
        }
        .loading-text { font-size: 16px; letter-spacing: 2px; margin-top: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* --- 内容区域 --- */
        .content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; /* 初始隐藏，等音乐Ready后再淡入 */
            transition: opacity 1.5s ease;
        }

        /* 图片样式：初始不可见，用于JS控制动画 */
        .photo-item {
            width: 80%; max-width: 400px; margin: 10px auto;
            border-radius: 10px; box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            opacity: 0; transform: translateY(20px); /* 初始下沉且透明 */
            transition: all 0.8s ease-out; /* 上浮动画 */
            display: block;
        }

        /* 激活状态的类 */
        .photo-item.visible { opacity: 1; transform: translateY(0); }

        /* 简单的文字标题 */
        h1 { color: #fff; margin-bottom: 20px; font-weight: 300; text-align: center; opacity: 0; transition: opacity 1s; }
        h1.visible { opacity: 1; }

    </style>
</head>
<body>

<div id="app">
    <!-- 1. 加载层 -->
    <div id="loading-screen">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div class="loading-text">正在准备惊喜...</div>
    </div>

    <!-- 2. 内容层 -->
    <div class="content-layer" id="main-content">
        <h1 id="main-title">升学宴邀请</h1>
        
        <!-- 这里的 src 先留空或放一个极小的占位图，data-src 放真实地址 -->
        <!-- 这种写法叫“懒加载”，防止浏览器自动偷跑流量 -->
        <img class="photo-item" data-src="images/photo1.jpg" alt="照片1">
        <img class="photo-item" data-src="images/photo2.jpg" alt="照片2">
        <img class="photo-item" data-src="images/photo3.jpg" alt="照片3">
    </div>
</div>

<!-- 音乐文件 (隐藏) -->
<audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script>
    // 配置项
    const CONFIG = {
        musicSrc: 'images/bgm.mp3', // 你的音乐路径
        photoDelay: 400,            // 每张图片出现的间隔时间 (毫秒)
        startDelay: 500             // 音乐就绪后，等待多久开始展示内容
    };

    const audio = document.getElementById('bgm');
    const loadingScreen = document.getElementById('loading-screen');
    const mainContent = document.getElementById('main-content');
    const photos = document.querySelectorAll('.photo-item');
    const title = document.getElementById('main-title');

    // 核心逻辑：预加载管理器
    function initLoader() {
        console.log("开始预加载音乐...");
        
        // 1. 强制加载音乐
        audio.load();

        // 2. 监听音乐可以播放的事件
        // canplaythrough: 浏览器估计如果现在开始播放，音频可以一直播放到结束而不需要停止缓冲
        audio.addEventListener('canplaythrough', onMusicReady, { once: true });
        
        // 备用方案：如果网络极快，canplaythrough可能不触发，监听 loadeddata
        audio.addEventListener('loadeddata', onMusicReady, { once: true });
    }

    function onMusicReady() {
        console.log("音乐已就绪，准备展示...");
        
        // 尝试播放一下（静音），以解锁浏览器的自动播放策略
        // 这样用户后续点击交互时就能直接有声音
        audio.play().then(() => {
            audio.pause(); 
            audio.currentTime = 0;
        }).catch(e => console.log("等待用户交互解锁音频"));

        setTimeout(startShowSequence, CONFIG.startDelay);
    }

    function startShowSequence() {
        // 1. 隐藏 Loading 层
        loadingScreen.style.opacity = '0';
        setTimeout(() => { loadingScreen.style.display = 'none'; }, 1000);

        // 2. 显示主内容背景
        mainContent.style.opacity = '1';
        
        // 3. 真正开始加载图片资源 (将 data-src 赋值给 src)
        // 此时浏览器才开始下载图片，保证带宽全给音乐用完了
        photos.forEach((img, index) => {
            const realSrc = img.getAttribute('data-src');
            if(realSrc) {
                img.src = realSrc; // 触发图片下载
                
                // 设置依次显示的动画
                setTimeout(() => {
                    img.classList.add('visible');
                }, index * CONFIG.photoDelay + 500); // 基础延迟 + 间隔
            }
        });

        // 标题显示
        setTimeout(() => title.classList.add('visible'), 200);

        // 4. 正式播放音乐
        // 注意：大多数浏览器仍要求用户有点击操作才能发声。
        // 如果你的场景是用户点击进入的页面，这里可以直接 play()。
        // 如果是直接打开URL，可能需要加一个点击事件监听器来触发 play()。
        playMusicSafely();
    }

    function playMusicSafely() {
        audio.volume = 0.8;
        let playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log("自动播放被拦截，添加点击监听");
                // 如果自动播放失败，添加一次性点击事件来播放
                document.body.addEventListener('click', function unlockAudio() {
                    audio.play();
                    document.body.removeEventListener('click', unlockAudio);
                }, { once: true });
            });
        }
    }

    // 启动
    window.onload = initLoader;

</script>
</body>
</html>
